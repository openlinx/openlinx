[project]
name = "spider"
version = "0.1.0.dev0"
description = "Agent-first SEO crawler: a CLI and a local MCP server driven by AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "orjson>=3.12.0",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
spider = "spider.cli.app:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "covdefaults>=2.3.0",
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "packaging>=26.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT",
    "S", "ASYNC", "PTH", "DTZ", "T20", "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.set_event_loop_policy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.get_event_loop_policy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.WindowsSelectorEventLoopPolicy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.WindowsProactorEventLoopPolicy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.DefaultEventLoopPolicy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.AbstractEventLoopPolicy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.events.AbstractEventLoopPolicy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.windows_events.DefaultEventLoopPolicy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.unix_events.DefaultEventLoopPolicy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.events.set_event_loop_policy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.events.get_event_loop_policy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.windows_events.WindowsSelectorEventLoopPolicy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"asyncio.windows_events.WindowsProactorEventLoopPolicy".msg = "Use asyncio.run(..., loop_factory=spider.aio.loop_factory)."
"sys.stdout".msg = "Write output through spider.output, which writes UTF-8 bytes."
"sys.stderr".msg = "Write output through spider.output, which writes UTF-8 bytes."
"typer.echo".msg = "Write output through spider.output, which writes UTF-8 bytes."
"click.echo".msg = "Write output through spider.output, which writes UTF-8 bytes."

[tool.ruff.lint.per-file-ignores]
"src/spider/output/**" = ["TID251"]
"tests/**" = ["S101", "T20", "S603", "S607"]
"scripts/**" = ["T20", "S603", "TID251"]

[tool.mypy]
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov=spider"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["spider"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
