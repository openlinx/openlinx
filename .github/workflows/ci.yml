# Every gate on every OS and Python version (design D10 of 000-scaffold-project).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull requests: every run on main finishes, so each merge gets a full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      HYPOTHESIS_PROFILE: ci
      OPENSPEC_TELEMETRY: "0"
    defaults:
      run:
        # Git Bash on Windows too, so globs such as dist/*.whl expand the same everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked

      # .python-version pins 3.14; without this check a cell could silently test 3.14.
      - name: Check the cell runs the matrix Python
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: >-
          uv run python -c "import os, sys;
          v = '.'.join(map(str, sys.version_info[:2])); print(sys.version);
          assert v == os.environ['EXPECTED_PYTHON'], v"

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests and coverage
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Wheel smoke test
        # Both console scripts of the built wheel run, and print the same OpenLinx version line.
        run: |
          wheel="$(ls dist/*.whl)"
          linx="$(uv run --isolated --no-project --with "$wheel" linx --version)"
          openlinx="$(uv run --isolated --no-project --with "$wheel" openlinx --version)"
          echo "$linx"
          test "${linx#OpenLinx }" != "$linx" && test "$linx" = "$openlinx"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.13.0

      - name: Specs
        run: openspec validate --all --strict

      - name: Report script (seam 9)
        run: node --test "tests/js/**/*.test.mjs"
